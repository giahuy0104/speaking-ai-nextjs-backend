name: Deploy production

# Push/merge into can-bang-tai deploys that exact commit to the VPS.
# workflow_dispatch re-deploys the branch head, or a chosen earlier commit.
on:
  push:
    branches: [can-bang-tai]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit SHA already on can-bang-tai (empty = branch head)"
        required: false
        type: string
      simulate_ready_fail:
        description: "TEST ONLY: force post-deploy verification to fail to exercise rollback"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time. A running deploy is never cancelled; later ones queue.
concurrency:
  group: homi-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/giahuy0104/speaking-ai-nextjs-backend
  TARGET_SHA: ${{ inputs.sha || github.sha }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Only deploy can-bang-tai
        run: |
          if [ "$GITHUB_REF" != "refs/heads/can-bang-tai" ]; then
            echo "::error::Deploy is only allowed from can-bang-tai (ref: $GITHUB_REF)"; exit 1
          fi
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::TARGET_SHA must be a full 40-char lowercase commit SHA"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit must belong to can-bang-tai
        run: |
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "origin/can-bang-tai" \
            || { echo "::error::$TARGET_SHA is not on can-bang-tai"; exit 1; }

  verify:
    needs: guard
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.sha || github.sha }}

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TARGET_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      # Deploy scripts always come from the branch head that triggered this run, so an
      # older TARGET_SHA (re-deploy/rollback) works even if that commit predates deploy/.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare SSH (pinned host key, dedicated key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy ${{ env.TARGET_SHA }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          # Short-lived token of this run; sent over SSH stdin, never stored on the VPS.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIMULATE_FAIL: ${{ inputs.simulate_ready_fail }}
        run: |
          flags=""
          [ "$SIMULATE_FAIL" = "true" ] && flags="$flags --simulate-fail"
          {
            printf '%s %s\n' "$GHCR_USER" "$GHCR_TOKEN"
            tar -czf - docker-compose.redis.yml docker-compose.nginx.yml infra \
              deploy/deploy.sh deploy/rollback.sh deploy/lib.sh
          } | ssh -i ~/.ssh/deploy_key \
                -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o ServerAliveInterval=30 \
                -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "deploy $TARGET_SHA$flags"
      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
