name: Verify deployment

# Required check for pull requests into can-bang-tai. Pushes to can-bang-tai run
# the same job through deploy.yml (workflow_call), so it is not duplicated here.
on:
  pull_request:
    branches: [can-bang-tai, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to verify
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Isolated Redis/PostgreSQL containers; no project/production credentials.
      - run: npm run test:integration
      # The web image build runs `next build` (production build).
      - run: docker build --target web -t speaking-ai-railway-web:check .
      - run: docker build -f Dockerfile.worker -t speaking-ai-railway-worker:check .
      - run: npm run smoke:railway
