# DEV stack for api-dev.hoamytech.com. Fully separate from production:
# own Compose project, network, Redis containers/volumes, image repo and port.
# Lives in /opt/homi/backend-dev on the VPS (root-owned, copied by hand like prod).
#   docker compose --env-file .env.compose -f docker-compose.dev.yml up -d
name: speaking-ai-dev

x-redis: &redis
  image: redis:7.4-alpine
  restart: unless-stopped
  environment:
    REDISCLI_AUTH: "${CLOUDFLARE_POOL_REDIS_PASSWORD:?Set CLOUDFLARE_POOL_REDIS_PASSWORD in .env.compose}"
  command: ["sh", "-c", 'exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDISCLI_AUTH"']
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s
  # The pool store client destroys itself when a command takes over 1s.
  cpus: 0.5
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  # Service names must stay redis / redis-cache / redis-jobs: runtime-config.mjs
  # builds the Redis URLs from these hostnames when APP_RUNTIME=compose.
  # No host ports are published (prod uses 16379-16381 on loopback).
  redis:
    <<: *redis
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    mem_limit: 192m

  redis-cache:
    <<: *redis
    volumes:
      - ./infra/redis/cache.conf:/usr/local/etc/redis/redis.conf:ro
    mem_limit: 96m

  redis-jobs:
    <<: *redis
    volumes:
      - ./infra/redis/jobs.conf:/usr/local/etc/redis/redis.conf:ro
      - audio-jobs-data:/data
    mem_limit: 192m

  # Two backends like production. Names/ports must match infra/nginx/nginx.dev.conf
  # (upstreams + "/api/audio/stream:<node>" keys) and SERVICES in deploy/lib.sh.
  backend-3000: &backend
    image: speaking-ai-backend-dev:${BACKEND_IMAGE_TAG:-local}
    pull_policy: never
    restart: unless-stopped
    init: true
    secrets:
      - app_env
    environment: &backend-environment
      APP_RUNTIME: compose
      APP_ENV_FILE: /run/secrets/app_env
      PERSISTENCE_BACKEND: postgres
      CLOUDFLARE_POOL_STORE: redis
      AUDIO_TRANSLATION_JOB_SHARED_DIRECTORY: /app/data/audio-translation-jobs
      AUDIO_TRANSLATION_JOB_STORAGE: local
      # Burst intake for the jobs path (accept 1000 submissions in ~1s, process
      # from the queue). These override .env.local: start.mjs never overwrites
      # variables that are already set.
      # Uploads buffered per instance = MAX_IN_FLIGHT + MAX_QUEUED.
      CLOUDFLARE_POOL_MAX_IN_FLIGHT: "100"
      CLOUDFLARE_POOL_MAX_QUEUED: "500"
      CLOUDFLARE_POOL_MAX_BUFFERED_BYTES: "134217728"
      # 1000 is the ceiling enforced in audioTranslationJobs.ts.
      AUDIO_TRANSLATION_JOB_MAX_PENDING: "1000"
      # Raised from 10 so a small token pool can drive a load test.
      AUDIO_TRANSLATION_JOB_MAX_PER_CLIENT: "100"
      PORT: "3000"
      AUDIO_STREAM_NODE: "3000"
    expose:
      - "3000"
    volumes:
      - audio-job-files:/app/data/audio-translation-jobs
    depends_on:
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 75s
    mem_limit: 1g
    # The VPS has 4 cores shared with production; keep the two dev backends under 3.
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend-3001:
    <<: *backend
    environment:
      <<: *backend-environment
      PORT: "3001"
      AUDIO_STREAM_NODE: "3001"
    expose:
      - "3001"

  # Durable BullMQ worker; needs AUDIO_TRANSLATION_JOBS_ENABLED=true in .env.local.
  #   docker compose --env-file .env.compose -f docker-compose.dev.yml --profile jobs up -d audio-worker
  audio-worker:
    image: speaking-ai-audio-worker-dev:${BACKEND_IMAGE_TAG:-local}
    pull_policy: never
    profiles: [jobs]
    restart: unless-stopped
    init: true
    secrets:
      - app_env
    environment:
      APP_RUNTIME: compose
      APP_ENV_FILE: /run/secrets/app_env
      PERSISTENCE_BACKEND: postgres
      CLOUDFLARE_POOL_STORE: redis
      AUDIO_TRANSLATION_JOB_SHARED_DIRECTORY: /app/data/audio-translation-jobs
      AUDIO_TRANSLATION_JOB_STORAGE: local
      # Match the Cloudflare text concurrency (8 per account x 2 accounts).
      # Higher only produces provider 429s; the code caps this at 20.
      AUDIO_TRANSLATION_JOB_WORKER_CONCURRENCY: "16"
    volumes:
      - audio-job-files:/app/data/audio-translation-jobs
    depends_on:
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
    stop_grace_period: 75s
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      # Host Nginx (TLS for api-dev.hoamytech.com) proxies to this port. Prod uses 8080.
      - "127.0.0.1:${DEV_NGINX_HTTP_PORT:-8081}:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-3000:
        condition: service_healthy
      backend-3001:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_signal: SIGQUIT
    stop_grace_period: 75s
    # Buffers every upload body before proxying; 64m / 0.25 CPU starved under a burst.
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  app_env:
    file: ./.env.local

volumes:
  redis-data:
  audio-jobs-data:
  audio-job-files:
