# DEV stack only (docker-compose.dev.yml): two backends, the same proxy
# behaviour as infra/nginx/nginx.conf so dev exercises the production request path.
worker_processes 1;
worker_shutdown_timeout 65s;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    map $http_x_forwarded_proto $origin_scheme {
        default $scheme;
        https https;
        http http;
    }

    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[a-zA-Z0-9._:-]{8,100}$" $http_x_request_id;
    }

    log_format requests escape=json
        '{"timestamp":"$time_iso8601","requestId":"$correlation_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"requestTime":"$request_time","upstream":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status","upstreamTime":"$upstream_response_time"}';
    access_log /dev/stdout requests;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream speaking_ai {
        zone speaking_ai 64k;
        least_conn;
        server backend-3000:3000 resolve max_fails=2 fail_timeout=10s;
        server backend-3001:3001 resolve max_fails=2 fail_timeout=10s;
        keepalive 16;
        keepalive_timeout 60s;
    }

    # Same stream pinning as production: the backend that answered
    # /api/audio/translate appends ?node=<port> so the follow-up stream joins
    # its in-flight English TTS. The peer stays available as a backup.
    upstream speaking_ai_3000 {
        zone speaking_ai_3000 64k;
        server backend-3000:3000 resolve max_fails=2 fail_timeout=10s;
        server backend-3001:3001 resolve backup;
        keepalive 4;
        keepalive_timeout 60s;
    }

    upstream speaking_ai_3001 {
        zone speaking_ai_3001 64k;
        server backend-3001:3001 resolve max_fails=2 fail_timeout=10s;
        server backend-3000:3000 resolve backup;
        keepalive 4;
        keepalive_timeout 60s;
    }

    map "$uri:$arg_node" $speaking_ai_upstream {
        default speaking_ai;
        "/api/audio/stream:3000" speaking_ai_3000;
        "/api/audio/stream:3001" speaking_ai_3001;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 32m;
        client_body_timeout 60s;
        send_timeout 60s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://$speaking_ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $correlation_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_ignore_client_abort off;

            proxy_next_upstream error timeout;
            # Fail over transport failures; never replay an already-sent POST.
            proxy_next_upstream_tries 2;
            proxy_intercept_errors off;

            proxy_pass_header X-Accel-Buffering;
            proxy_hide_header X-Request-Id;
            add_header X-Request-Id $correlation_id always;
        }
    }
}
