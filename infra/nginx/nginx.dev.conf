# DEV stack only (docker-compose.dev.yml): one backend, otherwise the same proxy
# behaviour as infra/nginx/nginx.conf so dev exercises the production request path.
worker_processes 1;
worker_shutdown_timeout 65s;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    map $http_x_forwarded_proto $origin_scheme {
        default $scheme;
        https https;
        http http;
    }

    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[a-zA-Z0-9._:-]{8,100}$" $http_x_request_id;
    }

    log_format requests escape=json
        '{"timestamp":"$time_iso8601","requestId":"$correlation_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"requestTime":"$request_time","upstream":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status","upstreamTime":"$upstream_response_time"}';
    access_log /dev/stdout requests;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream speaking_ai {
        zone speaking_ai 64k;
        server backend:3000 resolve max_fails=2 fail_timeout=10s;
        keepalive 16;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 32m;
        client_body_timeout 60s;
        send_timeout 60s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://speaking_ai;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $correlation_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_ignore_client_abort off;

            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 1;
            proxy_intercept_errors off;

            proxy_pass_header X-Accel-Buffering;
            proxy_hide_header X-Request-Id;
            add_header X-Request-Id $correlation_id always;
        }
    }
}
