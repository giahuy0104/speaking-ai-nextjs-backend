# Local Docker Redis for the Cloudflare admission store.
# Host port is bound to loopback by docker-compose.redis.yml.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# Retain quota/cooldown state across ordinary container restarts.
appendonly yes
appendfsync everysec
save ""

# Evicting quota keys could incorrectly admit more inference calls.
maxmemory 128mb
maxmemory-policy noeviction

timeout 0
tcp-keepalive 60
